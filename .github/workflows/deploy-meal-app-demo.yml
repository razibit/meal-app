name: Deploy Meal App GitHub Pages demo

on:
  push:
    branches:
      - main
    paths:
      - "github-pages-demo/**"
      - ".github/workflows/deploy-meal-app-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: github-pages-demo/package-lock.json

      - name: Install demo dependencies
        run: npm ci
        working-directory: github-pages-demo

      - name: Build demo for GitHub Pages
        run: npm run build:pages
        working-directory: github-pages-demo

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
